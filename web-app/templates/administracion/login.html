<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración — neto</title>
  <link rel="icon" href="{{ url_for('static', filename='rebranding/logos/favicon.ico') }}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='rebranding/logos/favicon-32.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='rebranding/logos/apple-touch-icon.png') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <img src="{{ url_for('static', filename='rebranding/logos/neto-logo-transparent-600w.png') }}"
         alt="neto" class="login-logo" />

    <div class="login-divider"></div>

    <p style="text-align:center; font-size:0.95rem; font-weight:600; margin-bottom:1rem;">
      <i class="bi bi-shield-lock-fill"></i> Panel de Administración
    </p>

    {% if error %}
      <div class="ei-alert ei-alert-danger" style="margin-bottom:1rem;">
        <i class="bi bi-exclamation-triangle-fill"></i>{{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('administracion.login') }}">
      <label class="form-label-ei">Contraseña de administrador</label>
      <div class="login-input-wrap">
        <i class="bi bi-lock login-input-icon"></i>
        <input type="password" name="password" class="ei-input"
               placeholder="••••••••" required autofocus />
      </div>

      <button type="submit" class="login-submit">
        Ingresar
      </button>
    </form>

    <p class="login-footer">neto by Empowered Investor &copy; {{ 2026 }}</p>
  </div>
</div>
</body>
</html>
