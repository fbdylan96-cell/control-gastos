<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — neto</title>
  <link rel="icon" href="{{ url_for('static', filename='rebranding/logos/favicon.ico') }}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='rebranding/logos/favicon-32.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='rebranding/logos/apple-touch-icon.png') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <img src="{{ url_for('static', filename='rebranding/logos/neto-logo-transparent-600w.png') }}"
         alt="neto" class="login-logo" />

    <div class="login-divider"></div>

    {% if error %}
      <div class="ei-alert ei-alert-danger" style="margin-bottom:1rem;">
        <i class="bi bi-exclamation-triangle-fill"></i>{{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('empresa.login') }}">
      <label class="form-label-ei">Usuario</label>
      <div class="login-input-wrap">
        <i class="bi bi-person login-input-icon"></i>
        <input type="text" name="username" class="ei-input"
               placeholder="tu usuario" required autofocus />
      </div>

      <label class="form-label-ei">Contraseña</label>
      <div class="login-input-wrap">
        <i class="bi bi-lock login-input-icon"></i>
        <input type="password" name="password" class="ei-input"
               placeholder="••••••••" required />
      </div>

      <button type="submit" class="login-submit">
        Ingresar
      </button>
    </form>

    <div style="text-align:center; margin-top:0.9rem;">
      <a href="{{ url_for('empresa.olvido') }}"
         style="font-size:0.84rem; color:#1F4D8E; text-decoration:none;">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <div style="text-align:center; margin-top:1rem;">
      <a href="{{ url_for('terminos') }}" target="_blank" rel="noopener"
         style="font-size:0.82rem; color:rgba(21,25,30,0.5); text-decoration:none;">
        <i class="bi bi-file-text" style="margin-right:4px;"></i>Ver términos y condiciones
      </a>
    </div>

    <p class="login-footer">neto by Empowered Investor &copy; {{ 2026 }}</p>
  </div>
</div>
</body>
</html>
