<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>neto</title>
  <link rel="icon" href="{{ url_for('static', filename='rebranding/logos/favicon.ico') }}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='rebranding/logos/favicon-32.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='rebranding/logos/apple-touch-icon.png') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
  <style>
    .app-selector {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .app-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.25rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .app-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .app-btn-empresa {
      background: var(--dark);
      color: var(--cream);
    }
    .app-btn-persona {
      background: var(--mint, #2bb673);
      color: #fff;
    }
    .app-btn-admin {
      background: var(--blue);
      color: #fff;
    }
    .app-btn-plan {
      /* Acentos del logo Empowered Investor (verde "W" → azul "in") */
      background: linear-gradient(135deg, #34d399, #3b5bdb);
      color: #fff;
    }
    /* El botón "Empowered Investor" es un <button> que despliega un submenú */
    button.app-btn {
      border: none;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      text-align: left;
    }
    .ei-chevron { margin-left: auto; font-size: 0.9rem; transition: transform 0.2s; }
    .app-submenu {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 0 0 0 1.25rem;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
    }
    .app-submenu.open {
      max-height: 200px;
      opacity: 1;
      margin-top: -0.4rem;
    }
    .app-sub-btn {
      background: var(--cream, #f6f3ec);
      color: var(--dark);
      border: 1.5px solid rgba(21, 25, 30, 0.12);
      padding: 0.7rem 1.1rem;
      font-size: 0.9rem;
    }
    .app-sub-btn i { color: #3b5bdb; }
    .app-sub-btn-soon {
      color: rgba(21, 25, 30, 0.45);
      cursor: not-allowed;
    }
    .app-sub-btn-soon i { color: rgba(21, 25, 30, 0.35); }
    .app-sub-btn-soon:hover { transform: none; box-shadow: none; }
    .soon-tag {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: rgba(21, 25, 30, 0.5);
      background: rgba(21, 25, 30, 0.07);
      border-radius: 20px;
      padding: 2px 9px;
    }
    .app-btn i {
      font-size: 1.2rem;
    }
    .index-subtitle {
      font-size: 0.85rem;
      color: rgba(21,25,30,0.45);
      margin-top: 0.25rem;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <img src="{{ url_for('static', filename='rebranding/logos/neto-logo-transparent-600w.png') }}"
         alt="neto" class="login-logo" />

    <div class="login-divider"></div>

    <p class="index-subtitle">Selecciona la aplicación a la que deseas acceder</p>

    <div class="app-selector">
      <a href="{{ url_for('empresa.login') }}" class="app-btn app-btn-empresa">
        <i class="bi bi-bar-chart-line-fill"></i>
        App Empresa/Familia
      </a>
      <a href="{{ url_for('persona.login') }}" class="app-btn app-btn-persona">
        <i class="bi bi-person-fill"></i>
        App Persona
      </a>
      <a href="{{ url_for('administracion.index') }}" class="app-btn app-btn-admin">
        <i class="bi bi-shield-lock-fill"></i>
        Panel de Administración
      </a>
      <button type="button" class="app-btn app-btn-plan" id="eiToggle"
              aria-expanded="false" aria-controls="eiSubmenu">
        <i class="bi bi-compass"></i>
        Empowered Investor
        <i class="bi bi-chevron-down ei-chevron" id="eiChevron"></i>
      </button>
      <div class="app-submenu" id="eiSubmenu">
        <a href="/calculadora/" target="_blank" rel="noopener" class="app-btn app-sub-btn">
          <i class="bi bi-graph-up-arrow"></i>
          Plan de Inversión
        </a>
        <a href="#" class="app-btn app-sub-btn app-sub-btn-soon"
           onclick="return false;" aria-disabled="true" title="Muy pronto disponible">
          <i class="bi bi-clipboard2-pulse"></i>
          Diagnóstico Financiero
          <span class="soon-tag">próximamente</span>
        </a>
      </div>
    </div>

    <p class="login-footer" style="margin-top:2rem;">neto by Empowered Investor &copy; {{ 2026 }}</p>
  </div>
</div>

<script>
  (function () {
    var toggle = document.getElementById('eiToggle');
    var menu = document.getElementById('eiSubmenu');
    var chevron = document.getElementById('eiChevron');
    if (!toggle || !menu) return;
    toggle.addEventListener('click', function () {
      var open = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (chevron) chevron.style.transform = open ? 'rotate(180deg)' : '';
    });
  })();
</script>
</body>
</html>
